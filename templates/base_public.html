<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}SecureWatch{% endblock %} — Real-Time Linux Security Monitoring</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <nav class="public-nav">
    <a href="{{ url_for('index') }}" class="brand-logo">
      <div class="logo-icon">🛡</div>
      <div>
        <span>Secure<strong>Watch</strong></span>
        <span class="badge-live">Live</span>
      </div>
    </a>
    <div class="nav-links">
      <a href="{{ url_for('index') }}">Home</a>
      <a href="{{ url_for('about') }}">About</a>
      <a href="{{ url_for('contact') }}">Contact</a>
      <a href="{{ url_for('login') }}" class="btn-login">Launch Dashboard →</a>
    </div>
  </nav>
  <div class="public-main">
    {% block content %}{% endblock %}
  </div>
  <footer class="public-footer">
    <p>© 2025 SecureWatch &nbsp;·&nbsp; Linux Security Monitoring Platform &nbsp;·&nbsp; Built for SOC teams</p>
  </footer>
</body>
</html>
